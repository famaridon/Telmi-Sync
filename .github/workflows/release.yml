name: Release

# Tags are not v-prefixed in this repository (0.17.0, not v0.17.0), which is
# also why build.publish sets vPrefixedTagName to false.
on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      # One platform failing should not throw away the artifacts of the others.
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-latest
          - name: Linux
            os: ubuntu-latest
          - name: Windows
            os: windows-latest

    defaults:
      run:
        # Git Bash on the Windows runner, so the three jobs share one syntax.
        shell: bash

    env:
      # A manual run builds without touching any release; only a tag publishes.
      PUBLISH: ${{ startsWith(github.ref, 'refs/tags/') && 'always' || 'never' }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build web assets
        run: yarn react-scripts build

      # Two passes: the Intel artifact keeps the name it has always had so the
      # download links on telmi.fr stay valid, and the Apple Silicon one gets
      # the -silicon suffix. Mirrors the build:mac script.
      - name: Package macOS
        if: matrix.os == 'macos-latest'
        run: |
          yarn electron-builder --mac --x64 --publish "$PUBLISH"
          yarn electron-builder --mac --arm64 --publish "$PUBLISH" \
            -c.mac.artifactName='${productName}-${version}-silicon.${ext}'
        env:
          # Signing only happens when the certificate secrets are configured.
          # Without them electron-builder must not go looking for an identity
          # in the runner keychain, or it fails instead of shipping unsigned.
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ secrets.MAC_CSC_LINK != '' }}

      - name: Package Linux
        if: matrix.os == 'ubuntu-latest'
        run: yarn electron-builder --linux --x64 --publish "$PUBLISH"

      - name: Package Windows
        if: matrix.os == 'windows-latest'
        run: yarn electron-builder --win --x64 --publish "$PUBLISH"
        env:
          CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}

      # On a manual run nothing is published, so keep the installers around
      # for inspection. Retention is short: these are ~300 MB each.
      - name: Upload artifacts for inspection
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.name }}
          retention-days: 7
          if-no-files-found: error
          path: |
            electron/dist/*.dmg
            electron/dist/*.AppImage
            electron/dist/*.exe
